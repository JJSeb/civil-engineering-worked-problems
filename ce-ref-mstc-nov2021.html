<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <title>November 2021 MSTC Problems</title>
  <style>
    :root{--navy:#17324d;--teal:#087e8b;--ink:#203040;--muted:#617182;--line:#dce4ea;--paper:#fff;--bg:#f3f6f8}
    *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
    header{background:var(--navy);color:#fff;padding:24px max(20px,calc((100% - 920px)/2))}header a{color:#fff}main{max-width:920px;margin:auto;padding:20px}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}h1{line-height:1.15;margin:.2em 0}h2,h3{color:var(--navy)}
    .answer{border-left:4px solid var(--teal);padding:8px 12px;background:#edf8f5}.figure{display:block;width:min(100%,660px);height:auto;margin:14px auto;background:#fbfcfd;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
    .math{overflow-x:auto;text-align:center}mjx-container[display="true"]{overflow-x:auto;max-width:100%}footer{text-align:center;color:var(--muted);padding:20px;font-size:.85rem}

    .question-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 2px 8px rgba(23,50,77,.045);scroll-margin-top:14px}
    .question-card>h2,.question-card>h3,.question-card>h4{margin:.1em 0 1rem;color:var(--navy);line-height:1.3}
    .problem-statement,.worked-solution{border-radius:10px;padding:14px 16px;margin:12px 0;min-width:0}
    .problem-statement{background:#f5f8fa;border:1px solid var(--line)}
    .worked-solution{background:#fff;border:1px solid #dce9e7;border-left:4px solid var(--teal)}
    .problem-statement>:first-child,.worked-solution>:first-child{margin-top:0}
    .problem-statement>:last-child,.worked-solution>:last-child{margin-bottom:0}
    .problem-statement>p:first-child>strong:first-child,.worked-solution>p:first-child>strong:first-child{color:var(--navy)}
    #solutions,.panel,.section,.question-card,.problem-statement,.worked-solution{min-width:0;max-width:100%}
    .question-card p,.question-card li,header h1,header p{overflow-wrap:anywhere;min-width:0}
    .question-card mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
    .question-card mjx-container[display="true"]{display:block;text-align:center;padding:.2rem 0}
    .question-card .math{max-width:100%;overflow-x:auto;overflow-y:hidden;text-align:center}
    .question-card svg,.question-card img,.question-card figure{display:block;max-width:100%;height:auto;margin:14px auto}
    @media(max-width:600px){.question-card{padding:14px;margin:12px 0}.problem-statement,.worked-solution{padding:12px}}
  </style>
  <script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]}};</script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <header><p><a href="index.html">← All problem sets</a></p><h1>November 2021 · MSTC · Questions 1–69</h1><p>Worked solutions for all 69 questions.</p></header>
  <main><section id="content" class="panel">Loading solutions…</section></main>
  <footer>Worked problems · Equations rendered with MathJax</footer>
  <script>

  function wrapQuestionCards(root){
    const questionHeading = h => {
      const text=h.textContent.trim();
      if(h.tagName==='H2') return /^Question\s+\d+\b/i.test(text) || /^Questions\s+\d+\s*[–—-]\s*\d+\s*[—–-]\s+\S/i.test(text);
      return /^(?:Question\s+|Q\s*)?\d+(?:\b|[.)—–-])/i.test(text);
    };
    const headings=[...root.querySelectorAll('h2,h3,h4')].filter(questionHeading);
    let unwrapped=0, missingProblem=0, missingSolution=0;
    for(const heading of headings){
      if(heading.parentElement!==root){unwrapped++;continue;}
      const level=Number(heading.tagName.slice(1));
      const card=document.createElement('article'); card.className='question-card';
      root.insertBefore(card,heading);
      let node=heading;
      while(node){
        const next=node.nextSibling;
        if(node!==heading && node.nodeType===1 && /^H[1-6]$/.test(node.tagName) && Number(node.tagName.slice(1))<=level) break;
        card.appendChild(node); node=next;
      }
      const isLabel=(node,name)=>node.nodeType===1 && node.tagName==='P' && node.firstElementChild && /^(strong|b)$/i.test(node.firstElementChild.tagName) && new RegExp('^'+name+'(?:\\s+\\d+|\\s*\\(Question\\s+\\d+\\))?\\s*:', 'i').test(node.firstElementChild.textContent.trim());
      const problemLabels=[...card.children].filter(el=>isLabel(el,'Problem')).length;
      const solutionLabels=[...card.children].filter(el=>isLabel(el,'Solution')).length;
      if(!problemLabels) missingProblem++;
      if(!solutionLabels) missingSolution++;
      const sections=[];
      let active=null;
      const makeSection=kind=>{const section=document.createElement('div');section.className=kind==='problem'?'problem-statement':'worked-solution';sections.push(section);active=section;};
      let current=heading.nextSibling;
      while(current){
        const next=current.nextSibling;
        if(isLabel(current,'Problem')) makeSection('problem');
        else if(isLabel(current,'Solution')) makeSection('solution');
        if(!active && current.nodeType===3 && !current.textContent.trim()) card.appendChild(current);
        else {if(!active) makeSection('problem');active.appendChild(current);}
        current=next;
      }
      sections.forEach(section=>card.appendChild(section));
    }
    root.dataset.questionCards=String(headings.length-unwrapped);
    root.dataset.questionCardsUnwrapped=String(unwrapped);
    root.dataset.missingProblemLabels=String(missingProblem);
    root.dataset.missingSolutionLabels=String(missingSolution);
    if(unwrapped||missingProblem||missingSolution) console.warn('Question layout exceptions', {unwrapped,missingProblem,missingSolution,root});
    return {cards:headings.length-unwrapped,unwrapped,missingProblem,missingSolution};
  }
    fetch('ce-ref-mstc-nov2021.md').then(r=>{if(!r.ok)throw Error('Could not load the solution file');return r.text()}).then(md=>{
      const prepared=md.replace(/\\\(([^\n]*?)\\\)/g,(_,eq)=>'<span class="math-inline">$'+eq+'$</span>').replace(/\\\[([\s\S]*?)\\\]/g,(_,eq)=>'<div class="math">\\['+eq.trim()+'\\]</div>').replace(/\$\$\s*([\s\S]*?)\s*\$\$/g,(_,eq)=>'<div class="math">\\['+eq.trim()+'\\]</div>');
      const content=document.getElementById('content');
      content.innerHTML=marked.parse(prepared);
      wrapQuestionCards(content);
      if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();
    }).catch(e=>{document.getElementById('content').textContent=e.message});
  </script>
</body>
</html>
