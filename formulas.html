<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preboard Formula Reference</title>
<style>
:root{--navy:#17324d;--teal:#087e8b;--line:#dce4ea}*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#203040;font:16px/1.65 system-ui,sans-serif}header{background:var(--navy);color:white;padding:25px max(18px,calc((100% - 960px)/2))}header a{color:white}h1{margin:.25em 0}main{max-width:960px;margin:auto;padding:18px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}nav button{border:1px solid var(--teal);border-radius:8px;background:white;color:var(--navy);font:inherit;font-weight:700;padding:8px 18px;cursor:pointer}nav button[aria-selected=true]{background:var(--teal);color:white}.panel{background:white;padding:20px;border:1px solid var(--line);border-radius:14px}h2,h3{color:var(--navy);scroll-margin-top:1rem}h2{border-bottom:1px solid var(--line);padding-bottom:6px}#topics{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}#topics a{background:#edf5f6;color:#075b64;text-decoration:none;border-radius:6px;padding:4px 10px;font-size:.9rem}mjx-container[display=true]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:.2em 0}table{display:block;overflow-x:auto;border-collapse:collapse}td,th{padding:6px;border:1px solid var(--line)}@media(max-width:600px){main{padding:12px}.panel{padding:14px}}
article h3{margin-top:1.8em;margin-bottom:.5em;color:#075b64}article mjx-container[display=true]{background:#f0f7f8;border:1px solid #d4e8e9;border-radius:9px;padding:14px 10px;margin:1em 0!important;font-size:110%}article p{margin:.65em 0}article li{margin:.35em 0}
</style><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]}};</script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script></head><body>
<header><a href="index.html">← Worked problems</a><h1>Preboard Formula Reference</h1><p>Choose a subject, then jump to a topic.</p></header><main><nav aria-label="Subject"><button id="mstc" aria-selected="true">MSTC</button><button id="hpge" aria-selected="false">HPGE</button></nav><div class="panel"><div id="topics" aria-label="Topics"></div><article id="content">Loading formulas…</article></div></main>
<script>
async function show(subject){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.id===subject)));const content=document.getElementById('content'),topics=document.getElementById('topics');content.textContent='Loading formulas…';topics.replaceChildren();try{const r=await fetch('formulas-'+subject+'.md');if(!r.ok)throw Error('Unable to load formulas');let md=await r.text();const math=[];md=md.replace(/\\\[[\s\S]*?\\\]|\\\([^\n]*?\\\)/g,m=>{math.push(m);return 'MATHPLACEHOLDER'+(math.length-1)+'END';});content.innerHTML=marked.parse(md).replace(/MATHPLACEHOLDER(\d+)END/g,(_,i)=>math[+i]);content.querySelectorAll('h2').forEach((h,i)=>{h.id=subject+'-topic-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;topics.append(a)});if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetClear([content]);await MathJax.typesetPromise([content]);}history.replaceState(null,'','#'+subject);}catch(e){content.textContent=e.message;}}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.id)));show(location.hash==='#hpge'?'hpge':'mstc');
</script></body></html>
